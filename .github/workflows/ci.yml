name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck / build / unit / smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: End-to-end smoke test
        run: npm run smoke

  package:
    name: vsix package
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-dsh-vsix
          path: dist/*.vsix
