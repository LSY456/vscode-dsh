name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: security audit（npm audit + osv-scanner）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit（生产依赖，高危阻断）
        run: npm audit --omit=dev --audit-level=high

      - name: OSV-Scanner 漏洞扫描
        uses: google/osv-scanner-action@v1

  test:
    name: typecheck / build / unit / smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 供「协议第二实现」冒烟使用（examples/python-daemon，仅标准库，无 pip 依赖）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: End-to-end smoke test
        run: npm run smoke

      # 打包清单守卫：禁入项 / 必需项 / 体积门槛。放在 test job（而不是只在 main 上跑的
      # package job）才能拦住 PR 里悄悄放宽 .vscodeignore 的改动。
      - name: Package manifest guard
        run: npm run check:package

      # 协议「第二实现」冒烟：用 examples/python-daemon 的 Python daemon 驱动同一份协议，
      # 证明"后端可换"不是文档承诺而是可验证事实（--require：缺 Python 判失败，不许静默跳过）
      - name: Protocol second-implementation smoke（Python daemon）
        run: npm run smoke:protocol -- --require

  integration:
    name: integration test（vscode extension host）
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Integration tests（T1-T5，真实扩展宿主 ↔ daemon）
        run: xvfb-run -a node scripts/runIntegrationTests.js

  package:
    name: vsix package
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-dsh-vsix
          path: dist/*.vsix
