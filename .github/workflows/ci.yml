name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: security audit（npm audit + osv-scanner）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit（生产依赖，高危阻断）
        run: npm audit --omit=dev --audit-level=high

      - name: OSV-Scanner 漏洞扫描
        uses: google/osv-scanner-action@v1

  test:
    name: typecheck / build / unit / smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: End-to-end smoke test
        run: npm run smoke

  integration:
    name: integration test（vscode extension host）
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Integration tests（T1-T5，真实扩展宿主 ↔ daemon）
        run: xvfb-run -a node scripts/runIntegrationTests.js

  package:
    name: vsix package
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-dsh-vsix
          path: dist/*.vsix
