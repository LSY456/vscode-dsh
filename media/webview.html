<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src __CSS_URI__; script-src 'nonce-__NONCE__'; img-src data:;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="__CSS_URI__" />
  <title>dsh Agent</title>
</head>
<body>
  <header id="header">
    <div class="brand">dsh <span class="brand-sub">Agent</span></div>
    <span class="grow"></span>
    <button id="btn-new" class="icon-btn" type="button" title="新建会话（清空当前对话并向 daemon 申请新会话）">新会话</button>
    <button id="btn-history" class="icon-btn" type="button" title="历史会话" aria-label="历史会话">历史</button>
    <button id="btn-settings" class="icon-btn" type="button" title="模型设置" aria-label="模型设置">设置</button>
  </header>

  <div id="meta-bar">
    <span id="conn-dot" class="dot connecting" aria-hidden="true"></span>
    <div id="status" class="status connecting" role="status" aria-live="polite">连接中…</div>
    <span class="grow"></span>
    <span id="agent-mode" class="meta-chip" hidden></span>
    <span id="session-id" class="meta-chip mono" hidden></span>
  </div>

  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-title">dsh Agent</div>
      <div class="empty-hint">
        自动携带当前编辑器上下文（活动文件 / 选区 / 诊断 / git 状态）与 Agent 对话；
        文件改动先经原生 Diff 审查，高危工具先请求你审批。
      </div>
      <div class="suggest" role="list">
        <button type="button" class="suggest-item" data-prompt="解释当前文件的关键逻辑，并指出潜在问题">
          <b>解释</b> 当前文件的关键逻辑
        </button>
        <button type="button" class="suggest-item" data-prompt="请修改当前文件中的 TODO（write edit）">
          <b>修改</b> 当前文件里的 TODO
        </button>
        <button type="button" class="suggest-item" data-prompt="危险操作：请运行 bash rm -rf（danger）">
          <b>演示</b> 高危工具审批流程
        </button>
      </div>
    </div>
    <div id="messages" aria-live="polite"></div>
    <button id="btn-jump" class="jump-btn" type="button" hidden>↓ 有新内容</button>
  </main>

  <details id="trajectory-box" hidden>
    <summary>
      <span class="traj-title">执行迹线</span>
      <span id="traj-count" class="traj-count"></span>
    </summary>
    <div id="trajectory"></div>
  </details>

  <div id="pending-bar" class="pending-bar" role="group" aria-label="待处理请求" hidden>
    <div id="pending-label" class="pending-label"></div>
    <div id="pending-actions" class="pending-actions"></div>
  </div>

  <footer id="composer">
    <textarea id="input" rows="1" placeholder="输入 Prompt…Enter 发送，Shift+Enter 换行" aria-label="输入 Prompt"></textarea>
    <div class="composer-row">
      <span id="composer-hint" class="hint">Enter 发送 · Shift+Enter 换行</span>
      <button id="btn-cancel" class="btn danger" type="button" hidden>停止</button>
      <button id="btn-send" class="btn primary" type="button">发送</button>
    </div>
  </footer>

  <nav id="history-panel" class="sheet" hidden aria-label="历史会话">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <span class="sheet-title">历史会话</span>
        <span class="grow"></span>
        <button id="btn-history-close" class="icon-btn" type="button" aria-label="关闭历史会话">关闭</button>
      </div>
      <div class="sheet-body">
        <div id="history-list"></div>
      </div>
    </div>
  </nav>

  <nav id="settings-panel" class="sheet" hidden aria-label="模型设置">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <span class="sheet-title">模型设置</span>
        <span class="grow"></span>
        <button id="btn-settings-close" class="icon-btn" type="button" aria-label="关闭模型设置">关闭</button>
      </div>
      <div class="sheet-body">
        <form id="settings-form" autocomplete="off">
          <label class="settings-field">
            <span>API Key <em class="muted">（SecretStorage 安全存储，不在 settings.json 落明文）</em></span>
            <input id="inp-apikey" type="password" placeholder="留空则不修改" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span>模型名</span>
            <input id="inp-model" placeholder="deepseek-chat" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span>模型 Provider <em class="muted">（OpenAI 兼容 / Anthropic）</em></span>
            <select id="inp-provider">
              <option value="auto">auto（缺省 = OpenAI 兼容）</option>
              <option value="openai">openai</option>
              <option value="anthropic">anthropic</option>
            </select>
          </label>
          <label class="settings-field">
            <span>API Base URL</span>
            <input id="inp-baseurl" placeholder="https://api.deepseek.com/v1" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span>Agent 预设</span>
            <input id="inp-preset" placeholder="default" spellcheck="false" />
          </label>
          <div class="settings-actions">
            <button type="submit" class="btn primary">保存</button>
            <button type="button" id="btn-settings-restart" class="btn" hidden>重启 daemon 生效</button>
          </div>
          <div id="settings-msg" class="settings-msg muted"></div>
        </form>

        <div class="trust-section">
          <div class="section-head">信任的命令 <em class="muted">（免审批白名单）</em></div>
          <p class="muted trust-hint">
            审批卡点「接受并记住」后，同规则命令不再弹审批直接放行。规则脱敏存于工作区
            <code>.dsh/trust.json</code>（权限 0600，可手动审阅删除）。
          </p>
          <div id="trust-list" class="trust-list"></div>
          <div class="trust-actions">
            <button type="button" id="btn-trust-clear" class="btn danger">清空全部信任</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <script nonce="__NONCE__" src="__JS_URI__"></script>
</body>
</html>
