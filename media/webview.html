<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 样式表内联在下面的 <style> 里、由 nonce 放行，不再引用外部 CSS 文件。
       为什么：外部样式表只能靠 CSP 的 URL 匹配放行，而 webview 资源 URI 里带
       百分号编码的盘符路径（形如 /c%3A/Users/...），匹配一旦不成立就被
       default-src 'none' 整条拦掉 —— 症状恰好是"脚本正常、界面完全没有样式"，
       排查时极容易被误判成"改的样式没生效"（实测踩过）。内联后不经过 URL 匹配，
       顺带绕开 webview 的资源缓存，改样式必然生效。
       style-src 保留 cspSource（不带路径）以便将来确需引入其它样式资源。 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'nonce-__NONCE__' __CSP_SOURCE__; script-src 'nonce-__NONCE__'; img-src data:;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style nonce="__NONCE__">__CSS__</style>
  <title>dsh Agent</title>
</head>
<body>
  <!-- 顶栏：单行。左＝标识 + 当前会话标题，右＝图标动作组。
       状态信息（连接 / 模式 / 会话号）下移到输入区下方，避免在 ~300px 侧边栏里
       用两条 bar 吃掉六分之一高度却只装了两个字的有效信息。 -->
  <header id="header">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="16" height="16" focusable="false">
        <rect x="1.7" y="1.7" width="12.6" height="12.6" rx="3.6" fill="none" stroke="currentColor" stroke-width="1.3" />
        <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M5.8 5.5v5M5.8 5.5h2a2.5 2.5 0 0 1 0 5h-2" />
      </svg>
    </span>
    <div class="brand-block">
      <span class="brand">dsh Agent</span>
      <span id="session-title" class="session-title" hidden></span>
    </div>
    <span class="grow"></span>
    <div class="header-actions">
      <button id="btn-new" class="icon-btn" type="button" title="新建会话" aria-label="新建会话">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M8 3.6v8.8M3.6 8h8.8" />
        </svg>
      </button>
      <button id="btn-trajectory" class="icon-btn has-badge" type="button" title="执行迹线（审计）" aria-label="执行迹线" hidden>
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M2.6 4.2h10.8M4.6 8h6.8M6.6 11.8h2.8" />
        </svg>
        <span id="traj-badge" class="traj-badge"></span>
      </button>
      <button id="btn-history" class="icon-btn" type="button" title="历史会话" aria-label="历史会话">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.3" />
          <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M8 4.9V8l2.4 1.5" />
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="模型设置" aria-label="模型设置">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M2.4 5h11.2M2.4 11h11.2" />
          <circle cx="6.2" cy="5" r="1.7" fill="var(--vscode-editor-background, #1f1f1f)" stroke="currentColor" stroke-width="1.3" />
          <circle cx="10" cy="11" r="1.7" fill="var(--vscode-editor-background, #1f1f1f)" stroke="currentColor" stroke-width="1.3" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 状态横幅：一块 UI 承载两种"当前为什么不好用" —— 受限模式（工作区未被信任，daemon 未启动）
       与演示模式（未配 Key）。谁更严重谁优先，判定与切换见 media/webview.js 的 renderStateBanner()。 -->
  <div id="state-banner" class="state-banner" role="alert" hidden>
    <span id="state-banner-tag" class="state-tag"></span>
    <span id="state-banner-text" class="state-text"></span>
    <span class="grow"></span>
    <button id="btn-state-action" class="btn-sm" type="button"></button>
  </div>

  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="26" height="26" focusable="false">
          <rect x="1.7" y="1.7" width="12.6" height="12.6" rx="3.6" fill="none" stroke="currentColor" stroke-width="1.2" />
          <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M5.8 5.5v5M5.8 5.5h2a2.5 2.5 0 0 1 0 5h-2" />
        </svg>
      </div>
      <div class="empty-title">开始与 dsh Agent 对话</div>
      <div class="empty-hint">
        自动携带当前编辑器上下文（活动文件 / 选区 / 诊断 / git 状态）；
        文件改动先经原生 Diff 审查，高危工具先请求你审批。
      </div>
      <!-- 建议项由 media/webview.js 按会话号轮换生成（池见 src/webview/suggestions.js）：
           写死在标记里的话，每次新建会话都只会重复同样几条。 -->
      <div id="suggest" class="suggest" role="list"></div>
      <div class="empty-foot">Enter 发送 · Shift+Enter 换行 · Esc 停止</div>
    </div>
    <div id="messages" aria-live="polite"></div>
    <button id="btn-jump" class="jump-btn" type="button" hidden>↓ 有新内容</button>
  </main>

  <div id="pending-bar" class="pending-bar" role="group" aria-label="待处理请求" hidden>
    <div id="pending-label" class="pending-label"></div>
    <div id="pending-actions" class="pending-actions"></div>
  </div>

  <footer id="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="问点什么，或描述你想改的地方…" aria-label="输入 Prompt"></textarea>
      <div class="composer-row">
        <span id="composer-hint" class="hint">Enter 发送 · Shift+Enter 换行</span>
        <button id="btn-cancel" class="btn danger" type="button" hidden>停止</button>
        <button id="btn-send" class="btn primary" type="button">发送</button>
      </div>
    </div>
  </footer>

  <!-- 状态行：贴在输入区下方（IDE 状态栏心智），字号最弱，不与内容争视线 -->
  <div id="meta-bar">
    <span id="conn-dot" class="dot connecting" aria-hidden="true"></span>
    <div id="status" class="status connecting" role="status" aria-live="polite">连接中…</div>
    <span class="grow"></span>
    <span id="agent-mode" class="meta-chip" hidden></span>
    <!-- 账户余额（DeepSeek 官方端点才有；拿不到就整块隐藏）。文案与提示由扩展组装 -->
    <span id="balance-chip" class="meta-chip" hidden></span>
  </div>

  <!-- 执行迹线：从底部堆叠中移出，改为按需打开的覆盖式面板（不主动打断对话） -->
  <nav id="trajectory-box" class="sheet" hidden aria-label="执行迹线">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <span class="sheet-title">执行迹线</span>
        <span id="traj-count" class="traj-count"></span>
        <span class="grow"></span>
        <button id="btn-trajectory-close" class="icon-btn" type="button" aria-label="关闭执行迹线">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4" />
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <div id="trajectory"></div>
      </div>
    </div>
  </nav>

  <nav id="history-panel" class="sheet" hidden aria-label="历史会话">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <span class="sheet-title">历史会话</span>
        <span class="grow"></span>
        <button id="btn-history-close" class="icon-btn" type="button" aria-label="关闭历史会话">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4" />
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <div id="history-list"></div>
      </div>
    </div>
  </nav>

  <nav id="settings-panel" class="sheet" hidden aria-label="模型设置">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <span class="sheet-title">模型设置</span>
        <span class="grow"></span>
        <button id="btn-settings-close" class="icon-btn" type="button" aria-label="关闭模型设置">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4" />
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <form id="settings-form" autocomplete="off">
          <label class="settings-field">
            <span>API Key <em class="muted">（SecretStorage 安全存储，不在 settings.json 落明文）</em></span>
            <input id="inp-apikey" type="password" placeholder="留空则不修改" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span>模型名 <em class="muted">（从下拉选择，避免手写错名字）</em></span>
            <select id="inp-model"></select>
            <span id="model-catalog-hint" class="muted"></span>
          </label>
          <label class="settings-field">
            <span>模型 Provider <em class="muted">（OpenAI 兼容 / Anthropic）</em></span>
            <select id="inp-provider">
              <option value="auto">auto（缺省 = OpenAI 兼容）</option>
              <option value="openai">openai</option>
              <option value="anthropic">anthropic</option>
            </select>
          </label>
          <label class="settings-field">
            <span>API Base URL</span>
            <input id="inp-baseurl" placeholder="https://api.deepseek.com/v1" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span>Agent 预设</span>
            <input id="inp-preset" placeholder="default" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span>工具调用轮次上限 <em class="muted">（1–50；用尽后 Agent 收束成结论，不再调工具）</em></span>
            <input id="inp-max-rounds" type="number" min="1" max="50" step="1" />
          </label>
          <label class="settings-field">
            <span>上下文预算（token） <em class="muted">（4000–1000000；超出按整轮丢弃最旧的工具轮）</em></span>
            <input id="inp-max-context" type="number" min="4000" max="1000000" step="1000" />
          </label>
          <label class="settings-field">
            <span>采样温度 <em class="muted">（0–2；留空 = 用内置缺省 0.2，越高越发散）</em></span>
            <input id="inp-temperature" type="number" min="0" max="2" step="0.1" />
          </label>
          <label class="settings-field">
            <span>输出上限 max_tokens <em class="muted">（留空 = 用服务端默认；Anthropic 必填故回落 4096）</em></span>
            <input id="inp-max-tokens" type="number" min="1" max="131072" step="256" />
          </label>
          <div class="settings-actions">
            <button type="submit" class="btn primary">保存</button>
            <button type="button" id="btn-settings-restart" class="btn" hidden>重启 daemon 生效</button>
          </div>
          <div id="settings-msg" class="settings-msg muted"></div>
        </form>

        <div class="trust-section">
          <div class="section-head">信任的命令 <em class="muted">（免审批白名单）</em></div>
          <p class="muted trust-hint">
            审批卡点「接受并记住」后，同规则命令不再弹审批直接放行。规则脱敏存于工作区
            <code>.dsh/trust.json</code>（权限 0600，可手动审阅删除）。
          </p>
          <div id="trust-list" class="trust-list"></div>
          <div class="trust-actions">
            <button type="button" id="btn-trust-clear" class="btn danger">清空全部信任</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <script nonce="__NONCE__" src="__JS_URI__"></script>
</body>
</html>
