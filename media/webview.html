<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src __CSS_URI__; script-src 'nonce-__NONCE__'; img-src data:;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="__CSS_URI__" />
  <title>dsh Agent</title>
</head>
<body>
  <header id="header">
    <div class="brand">dsh <span class="brand-sub">Agent</span></div>
    <button id="btn-history" class="ghost" title="历史会话">历史</button>
    <button id="btn-settings" class="ghost" title="模型设置">设置</button>
    <div id="status" class="status connecting">连接中…</div>
  </header>

  <nav id="history-panel" hidden>
    <div class="history-head">历史会话</div>
    <div id="history-list"></div>
  </nav>

  <nav id="settings-panel" hidden>
    <div class="settings-head">模型设置</div>
    <form id="settings-form" autocomplete="off">
      <label class="settings-field">
        <span>API Key <em class="muted">（SecretStorage 安全存储，不在 settings.json 落明文）</em></span>
        <input id="inp-apikey" type="password" placeholder="留空则不修改" spellcheck="false" />
      </label>
      <label class="settings-field">
        <span>模型名</span>
        <input id="inp-model" placeholder="deepseek-chat" spellcheck="false" />
      </label>
      <label class="settings-field">
        <span>API Base URL</span>
        <input id="inp-baseurl" placeholder="https://api.deepseek.com/v1" spellcheck="false" />
      </label>
      <label class="settings-field">
        <span>Agent 预设</span>
        <input id="inp-preset" placeholder="default" spellcheck="false" />
      </label>
      <div class="settings-actions">
        <button type="submit" class="primary">保存</button>
        <button type="button" id="btn-settings-restart" class="ghost" hidden>重启 daemon 生效</button>
        <button type="button" id="btn-settings-close" class="ghost">关闭</button>
      </div>
      <div id="settings-msg" class="settings-msg muted"></div>
    </form>

    <div class="trust-section">
      <div class="settings-head">信任的命令 <em class="muted">（免审批白名单）</em></div>
      <p class="muted trust-hint">
        审批卡点「接受并记住」后，同规则命令不再弹审批直接放行。规则脱敏存于工作区
        <code>.dsh/trust.json</code>（权限 0600，可手动审阅删除）。
      </p>
      <div id="trust-list" class="trust-list"></div>
      <div class="trust-actions">
        <button type="button" id="btn-trust-clear" class="ghost danger">清空全部信任</button>
      </div>
    </div>
  </nav>

  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-title">dsh Agent</div>
      <div class="empty-hint">
        基于当前编辑器上下文（活动文件 / 选区 / 诊断 / git 状态）与 dsh Agent Daemon 对话。
        <br />示例：<em>“请修改 src/foo.ts 中的 TODO”</em>（触发原生 Diff 审查）
        <br />示例：<em>“危险操作：运行 bash rm -rf”</em>（触发工具审批卡）
      </div>
    </div>
    <div id="messages"></div>
    <details id="trajectory-box" hidden>
      <summary>执行迹线（Trajectory）</summary>
      <div id="trajectory"></div>
    </details>
  </main>

  <div id="toolbar">
    <span id="session-id" class="muted"></span>
    <span class="spacer"></span>
    <button id="btn-clear" class="ghost" title="清空当前视图">清空</button>
  </div>

  <footer id="composer">
    <textarea id="input" rows="3" placeholder="输入 Prompt：Enter 发送，Shift+Enter 换行"></textarea>
    <div class="composer-actions">
      <button id="btn-cancel" class="ghost" hidden>取消</button>
      <button id="btn-send" class="primary">发送</button>
    </div>
  </footer>

  <script nonce="__NONCE__" src="__JS_URI__"></script>
</body>
</html>
